<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldeseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-Login.css">
</head>

<body>
    <!-- HEADER: Logo + Datum + Login -->
    <header class="header">
        <div class="header-logo-links">
            <img class="logo-studierendenwerk" src="img/studierendenwerk-stuttgart.png"
                alt="Studierendenwerk Stuttgart Logo">
        </div>

        <div class="header-rechts">
            <img class="logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

            <div class="datum">
                <span id="datum"></span>
            </div>
        </div>
    </header>


    <div class="anmelde-container">
        <img class="login-logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

        <h1 class="login-titel">Bei Ihrem Konto anmelden</h1>

        <label class="feld-label" for="login-username">RZ-Benutzername (keine E-Mail-Adresse)</label>
        <input id="login-username" type="text" placeholder="Benutzername" class="login-input">

        <label class="feld-label" for="login-password">Passwort</label>
        <div class="passwort-wrapper">
            <input id="login-password" type="password" placeholder="Passwort" class="passwort-input">
            <button id="show-password" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" class="eye-icon">
            </button>
        </div>

        <button id="login-button" class="anmelde-button" type="button">Anmelden</button>
        <p id="login-message" class="login-message"></p>

        <div class="sektion-linie"></div>
        <p class="registrierung-text">Nutzen Sie die Website zum ersten Mal?</p>
        <button id="registrier-button" class="registrier-button" type="button">Registrieren</button>
    </div>


    <!-- FUSSZEILE -->
    <footer class="fußzeile">
        (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
        <a href="Datenschutz.html">Datenschutz</a> |
        <a href="Impressum.html">Impressum</a> |
        <a href="Kontakt.html">Kontakt</a>
    </footer>

    <!-- Datum Script -->
    <script>
        let heute = new Date();

        let tage = [
            "Sonntag", "Montag", "Dienstag",
            "Mittwoch", "Donnerstag", "Freitag", "Samstag"
        ];

        let wochentag = tage[heute.getDay()];
        let datum = heute.toLocaleDateString("de-DE");

        document.getElementById("datum").innerText = wochentag + ", " + datum;
    </script>
</body>
<script type="module" src="script-Login.js"></script>

</html>
