<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierungsseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-SignUp.css">
</head>

<body>
    <!-- HEADER: Logo + Datum + Login -->
    <header class="header">
        <div class="header-logo-links">
            <img class="logo-studierendenwerk" src="img/studierendenwerk-stuttgart.png"
                alt="Studierendenwerk Stuttgart Logo">
        </div>

        <div class="header-rechts">
            <img class="logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

            <div class="datum">
                <span id="datum"></span>
                <span id="bestellstatus-badge" class="bestellstatus-badge" style="display:none;"></span>

                <div class="profile-box">
                    <img class="profile-pic" src="img/Profil.svg" alt="Profilbild">
                    <span id="user-display-name">Anmelden ...</span>
                </div>
            </div>
        </div>
    </header>

    <div class="anmelde-container">
        <img class="login-logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

        <h1 class="login-titel">Neues Konto erstellen</h1>

        <label class="feld-label" for="signup-username">RZ-Benutzername (keine E-Mail-Adresse)</label>
        <input id="signup-username" type="text" placeholder="RZ-Kennung" class="login-input">

        <label class="feld-label" for="signup-email">Hochschule-E-Mail</label>
        <input id="signup-email" type="text" placeholder="@hs-esslingen.de" class="login-input" readonly>

        <label class="feld-label" for="signup-password">Passwort</label>
        <div class="passwort-wrapper">
            <input id="signup-password" type="password" placeholder="Passwort" class="passwort-input">
            <button id="show-signup-password" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" class="eye-icon">
            </button>
        </div>
        <label class="feld-label" for="signup-password-confirm">Passwort wiederholen</label>
        <div class="passwort-wrapper">
            <input id="signup-password-confirm" type="password" placeholder="Passwort wiederholen"
                class="passwort-input">
            <button id="show-signup-password-confirm" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" class="eye-icon">
            </button>
        </div>
        <p id="signup-message" class="signup-message"></p>
        <button id="signup-button" class="anmelde-button" type="button">Registrieren</button>

        <div class="sektion-linie"></div>
        <a class="registrier-button registrier-link" href="Login.html">Bereits registriert? Zum Login</a>


    </div>


    <!-- FUSSZEILE -->
    <footer class="fußzeile">
        (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
        <a href="https://www.hs-esslingen.de/datenschutz">Datenschutz</a> |
        <a href="https://www.hs-esslingen.de/impressum">Impressum</a> |
        <a href="https://www.hs-esslingen.de/kontakt">Kontakt</a>
    </footer>

    <!-- Datum Script -->
    <script>
        let heute = new Date();

        let tage = [
            "Sonntag", "Montag", "Dienstag",
            "Mittwoch", "Donnerstag", "Freitag", "Samstag"
        ];

        let wochentag = tage[heute.getDay()];
        let datum = heute.toLocaleDateString("de-DE");

        document.getElementById("datum").innerText = wochentag + ", " + datum;
    </script>
</body>

<script type="module" src="script-Abo-Status.js"></script>
<script type="module" src="script-SignUp.js"></script>

</html>
