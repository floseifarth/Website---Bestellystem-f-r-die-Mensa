<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldeseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-SSO-Login.css">
</head>

<body>
    <img class="logo" src="img/HochschuleEsslingen.svg" alt="">

    <div class="anmelde-container">

        <span style="font-size: 24px; display: block; text-align: center;"> Konto registrieren </span>
        <br>
        <span style="font-size: 12px; font-weight: bold;"> RZ-Benutzername (keine E-Mail-Adresse) </span>
        <input id="signup-username" type="text" placeholder="RZ-Kennung" class="login-input">
        <br>
        <span style="font-size: 12px; font-weight: bold;"> Passwort </span>
        <div class="passwort-wrapper">
            <input id="signup-password" type="password" placeholder="Passwort" class="passwort-input">
            <button id="show-signup-password" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" style="width: 20px; height: 20px;">
            </button>
        </div>
        <span style="font-size: 12px; font-weight: bold;"> Passwort bestätigen </span>
        <div class="passwort-wrapper">
            <input id="signup-password-confirm" type="password" placeholder="Passwort bestätigen" class="passwort-input">
            <button id="show-signup-password-confirm" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" style="width: 20px; height: 20px;">
            </button>
        </div>
        <br>
        <button id="signup-button" class="anmelde-button" type="button">Registrieren</button>
        <p style="font-size: 13px; text-align: center; margin-top: 10px;"> Bereits registriert? <a
                href="SSO-Login.html">Hier anmelden</a> </p>
        <p id="signup-message" style="font-size: 13px; text-align: center; color: #b42318; min-height: 1.2em;"></p>
    </div>


    <!-- FUSSZEILE -->
    <footer class="fußzeile">
        (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
        <a href="Datenschutz.html">Datenschutz</a> |
        <a href="Impressum.html">Impressum</a> |
        <a href="Kontakt.html">Kontakt</a>
    </footer>
</body>

<script type="module" src="script-SignUp.js"></script>

</html>
