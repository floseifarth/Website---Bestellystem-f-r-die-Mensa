<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldeseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-Identifizierung.css">
</head>

<body>
    <!-- HEADER: Logo + Datum + Login -->
    <header class="header">
        <div class="header-logo-links">
            <img class="logo-studierendenwerk" src="img/studierendenwerk-stuttgart.png"
                alt="Studierendenwerk Stuttgart Logo">
        </div>

        <div class="header-rechts">
            <img class="logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

            <div class="datum">
                <span id="datum"></span>
            </div>
        </div>
    </header>

    <div class="anmelde-container">
        <img class="login-logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

        <h1 class="login-titel">Einmalcode</h1>

        <p class="info-text info-center">
            Ein Einmalcode wird an folgende Hochschule-E-Mail gesendet:
        </p>

        <p class="email-text"><strong><span id="identifizierung-email">-</span></strong></p>

        <button id="btn-code-anfordern" class="anmelde-button" type="button">Einmalcode senden</button>

        <p id="identifizierung-message" class="identifizierung-message"></p>

        <p class="info-text info-center code-label">Einmalcode</p>
        <div class="pin-wrapper">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="pin-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <button id="btn-code-bestaetigen" class="anmelde-button" type="button">Code bestätigen</button>

        <!-- <p>
            Sollten Sie den Code nicht erhalten haben, überprüfen Sie bitte Ihren Spam-Ordner oder klicken Sie auf den
            Button, um einen neuen Code anzufordern.
        </p>
        <button id="btn-code-neu" class="anmelde-button" type="button">Neuen Code anfordern</button> -->


    </div>

    <div id="code-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="code-modal-title">
            <h2 id="code-modal-title" class="modal-title">Code gesendet</h2>
            <p id="code-modal-text" class="modal-text"></p>
            <button id="code-modal-ok" class="modal-button" type="button">OK</button>
        </div>
    </div>

    <!-- FUSSZEILE -->
    <footer class="fußzeile">
        (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
        <a href="https://www.hs-esslingen.de/datenschutz">Datenschutz</a> |
        <a href="https://www.hs-esslingen.de/impressum">Impressum</a> |
        <a href="https://www.hs-esslingen.de/kontakt">Kontakt</a>
    </footer>

    <!-- Datum Script -->
    <script>
        let heute = new Date();

        let tage = [
            "Sonntag", "Montag", "Dienstag",
            "Mittwoch", "Donnerstag", "Freitag", "Samstag"
        ];

        let wochentag = tage[heute.getDay()];
        let datum = heute.toLocaleDateString("de-DE");

        document.getElementById("datum").innerText = wochentag + ", " + datum;
    </script>
</body>

<script type="module" src="script-Abo-Status.js"></script>
    <script type="module" src="script-Identifizierung.js"></script>

</html>
