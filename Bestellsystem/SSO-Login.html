<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldeseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-SSO-Login.css">
</head>

<body>
    <img class="logo" src="img/HochschuleEsslingen.svg" alt="">


    <div class="anmelde-container">

        <span style="font-size: 24px; align-self: center;"> Bei ihrem Konto anmelden </span> <br><br>

        <span style="font-size: 12px"> RZ-Benutzername (keine E-Mail-Adresse) </span>
        <input id="login-email" type="email" placeholder="Benutzername" class="login-input">
        <br><br>

        <span style="font-size: 12px"> Passwort </span>
        <br>
        <input id="login-password" type="password" placeholder="Passwort" class="login-input"> <br><br>
        <br>

        <button id="login-button" class="anmelde-button" type="button">Anmelden</button>

    </div>




</body>

<script type="module" src="script-SSO-Login.js"></script>

</html>
