<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldeseite</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-SSO-Login.css">
</head>

<body>
    <img class="logo" src="img/HochschuleEsslingen.svg" alt="">

    <div class="anmelde-container">

        <span style="font-size: 24px; display: block; text-align: center;"> Bei Ihrem Konto anmelden </span>
        <br>
        <span style="font-size: 12px; font-weight: bold;"> RZ-Benutzername (keine E-Mail-Adresse) </span>
        <input id="login-username" type="text" placeholder="Benutzername" class="login-input">
        <br>
        <span style="font-size: 12px; font-weight: bold;"> Passwort </span>
        <div class="passwort-wrapper">
            <input id="login-password" type="password" placeholder="Passwort" class="passwort-input">
            <button id="show-password" type="button" class="show-password-button">
                <img src="img/eye-icon.svg" alt="Passwort anzeigen" style="width: 20px; height: 20px;">
            </button>
        </div>
        <br>
        <button id="login-button" class="anmelde-button" type="button">Anmelden</button>
        <p id="login-message" style="font-size: 13px; text-align: center; color: #b42318; min-height: 1.2em;"></p>

    </div>


    <div class="fußzeile">
        <a href="#">© Hochschule Esslingen - University of Applied Sciences 2025</a>
    </div>
    <br>
    <div class="fußzeile-links">
        <a href="Datenschutz.html">Impressum</a> | <a href="Impressum.html">AGB</a> | <a
            href="Kontakt.html">Datenschutz</a>
    </div>
</body>

<script type="module" src="script-SSO-Login.js"></script>

</html>
