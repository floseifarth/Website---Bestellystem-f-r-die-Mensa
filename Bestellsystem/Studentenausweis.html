<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentenausweis</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-Studentenausweis.css">
</head>

<body>
    <!-- HEADER: Logo + Datum + Login -->
    <header class="header">
        <div class="header-logo-links">
            <img class="logo-studierendenwerk" src="img/studierendenwerk-stuttgart.png"
                alt="Studierendenwerk Stuttgart Logo">
        </div>

        <div class="header-rechts">
            <img class="logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

            <div class="datum">
                <span id="datum"></span>
            </div>
        </div>
    </header>


    <div class="anmelde-container">
        <img class="login-logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

        <h1 class="login-titel">Studentenausweis</h1>

        <p class="info-text info-center">
            Bitte laden Sie hier ein Foto Ihres Studentenausweises hoch.</p>

        <label class="feld-label" for="studentenausweis-upload">Foto vom Studentenausweis</label>
        <input id="studentenausweis-upload" type="file" accept="image/*,.pdf,application/pdf" class="upload-input">
        <div id="upload-dropzone" class="upload-dropzone">
            <button id="upload-open" class="upload-open-button" type="button">Bild auswählen</button>
            <p class="upload-dropzone-text">oder Datei hier hineinziehen</p>
            <p class="upload-hinweis">Erlaubte Formate: JPG, PNG, HEIC, PDF</p>
        </div>
        <div id="upload-preview" class="upload-preview is-hidden">
            <img id="upload-preview-image" class="upload-preview-image" alt="Vorschau des hochgeladenen Ausweises">
            <p id="upload-preview-name" class="upload-preview-name"></p>
            <button id="upload-clear" class="upload-clear-button" type="button">Bild entfernen</button>
        </div>
        <p id="studentenausweis-message" class="status-message"></p>

        <label class="feld-label" for="login-vorname">Vorname</label>
        <input id="login-vorname" type="text" placeholder="Vorname" class="login-input">

        <label class="feld-label" for="login-nachname">Nachname</label>
        <input id="login-nachname" type="text" placeholder="Nachname" class="login-input">

        <label class="feld-label" for="login-matrikelnummer">Matrikelnummer</label>
        <input id="login-matrikelnummer" type="text" placeholder="Matrikelnummer" class="login-input">

        <button id="registrier-button" class="registrier-button" type="button">Daten speichern</button>
    </div>


    <!-- FUSSZEILE -->
    <footer class="fußzeile">
        (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
        <a href="Datenschutz.html">Datenschutz</a> |
        <a href="Impressum.html">Impressum</a> |
        <a href="Kontakt.html">Kontakt</a>
    </footer>

    <!-- Datum Script -->
    <script>
        let heute = new Date();

        let tage = [
            "Sonntag", "Montag", "Dienstag",
            "Mittwoch", "Donnerstag", "Freitag", "Samstag"
        ];

        let wochentag = tage[heute.getDay()];
        let datum = heute.toLocaleDateString("de-DE");

        document.getElementById("datum").innerText = wochentag + ", " + datum;
    </script>
</body>
<script type="module" src="script-Studentenausweis.js"></script>

</html>
