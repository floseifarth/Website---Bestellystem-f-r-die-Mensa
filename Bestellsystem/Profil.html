<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellsystem</title>

    <!-- Einkopieren der Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-Profil.css">
</head>

<body>
    <!-- HEADER: Logo + Datum + Login -->
    <header class="header">
        <div class="header-logo-links">
            <img class="logo-studierendenwerk" src="img/studierendenwerk-stuttgart.png"
                alt="Studierendenwerk Stuttgart Logo">
        </div>

        <div class="header-rechts">
            <img class="logo" src="img/HochschuleEsslingen.svg" alt="Hochschule Esslingen Logo">

            <div class="datum">
                <span id="datum"></span>

                <div class="profile-box">
                    <img class="profile-pic" src="img/Profil.svg" alt="Profilbild">
                    <a id="user-display-name" href="Anmeldestartseite.html">Anmelden ...</a>
                </div>
            </div>
        </div>
    </header>

    <div class="menuleiste-links">
        <a class="menu" href="startseite.html">
            <img class="menu-icon" src="img/haus.svg" alt="">
            Startseite
        </a> <br>
        <a class="menu" href="Speiseplan.html">
            <img class="menu-icon" src="img/speise.svg" alt="">
            Speiseplan
        </a> <br>
        <a class="menu" href="Vorbestellungen.html">
            <img class="menu-icon" src="img/shopping.svg" alt="">
            Vorbestellung
        </a> <br>
        <a class="menu" href="Meine Bestellungen.html">
            <img class="menu-icon" src="img/Liste.svg" alt="">
            Meine Bestellungen
        </a><br>
        <a class="menu" href="Bestellabo.html">
            <img class="menu-icon" src="img/Liste.svg" alt="">
            Bestellabo
        </a><br>
        <!--
        <a class="menu" href="Guthaben.html">
            <img class="menu-icon" src="img/Karte.svg" alt="">
            Guthaben
        </a><br>
        -->
        <a class="menu" href="QR-Code.html">
            <img class="menu-icon" src="img/QR-Code.svg" alt="">
            QR-Code
        </a><br>
        <a class="active" href="Profil.html">
            <img class="menu-icon" src="img/Profil.svg" alt="">
            Profil
        </a><br>
    </div>

    <div class="hauptfeld-mitte">
        <h1>Nutzerdaten</h1>
        <!-- Hier kommt der Profil-Inhalt -->


        <div id="profile-container"></div>

        <div id="Abmelde-Container">
            <button id="btn-abmelden" class="abmelden-button" type="button">Abmelden</button>

        </div>


        <!-- FUSSZEILE -->
        <footer class="fußzeile">
            (c) 2026 Hochschule Esslingen - Mensa Vorbestellung |
            <a href="Datenschutz.html">Datenschutz</a> |
            <a href="Impressum.html">Impressum</a> |
            <a href="Kontakt.html">Kontakt</a>
        </footer>

        <!-- Datum Script -->
        <script>
            let heute = new Date();

            let tage = [
                "Sonntag", "Montag", "Dienstag",
                "Mittwoch", "Donnerstag", "Freitag", "Samstag"
            ];

            let wochentag = tage[heute.getDay()];
            let datum = heute.toLocaleDateString("de-DE");

            document.getElementById("datum").innerText = wochentag + ", " + datum;
        </script>

        <script type="module" src="script-Profil.js"></script>

</body>

</html>
