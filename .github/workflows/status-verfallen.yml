name: Status nicht abgeholt setzen

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

jobs:
  status_update:
    runs-on: ubuntu-latest

    steps:
      - name: Bestellungen nach Abholzeit auf nicht abgeholt setzen
        run: |
          node <<'NODE'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY;

          const heute = new Date();
          const yyyy = heute.getFullYear();
          const mm = String(heute.getMonth() + 1).padStart(2, "0");
          const dd = String(heute.getDate()).padStart(2, "0");
          const heuteDatum = `${yyyy}-${mm}-${dd}`;

          async function main() {
            const url = `${SUPABASE_URL}/rest/v1/Bestellungen?bestell_datum=eq.${heuteDatum}&status=eq.bestellt`;

            const response = await fetch(url, {
              method: "PATCH",
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
                Prefer: "return=representation"
              },
              body: JSON.stringify({
                status: "nicht abgeholt"
              }),
            });

            if (!response.ok) {
              throw new Error("Supabase Fehler: " + await response.text());
            }

            const updatedRows = await response.json();
            console.log(`Bestellungen vom ${heuteDatum} auf "nicht abgeholt" gesetzt:`, updatedRows.length);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
