name: Nicht abgeholt Mail senden

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  mail_nicht_abgeholt:
    runs-on: ubuntu-latest

    steps:
      - name: Nicht abgeholt Mails senden
        run: |
          node <<'NODE'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY;
          const EMAILJS_SERVICE_ID = process.env.EMAILJS_GMAIL_SERVICE_ID;
          const EMAILJS_TEMPLATE_ID = process.env.EMAILJS_TEMPLATE_ID;
          const EMAILJS_PUBLIC_KEY = process.env.EMAILJS_PUBLIC_KEY;
          const EMAILJS_PRIVATE_KEY = process.env.EMAILJS_PRIVATE_KEY;
          const REPLY_TO = process.env.EMAILJS_REPLY_TO || "noreply@hs-esslingen.de";

          const heute = new Date();
          const yyyy = heute.getFullYear();
          const mm = String(heute.getMonth() + 1).padStart(2, "0");
          const dd = String(heute.getDate()).padStart(2, "0");
          const heuteDatum = `${yyyy}-${mm}-${dd}`;

          async function main() {
            const url = `${SUPABASE_URL}/rest/v1/Bestellungen?bestell_datum=eq.${heuteDatum}&status=eq.nicht%20abgeholt&nicht_abgeholt_mail_gesendet=eq.false&select=id,email,gericht_name,bestell_datum,preis,kategorie,nicht_abgeholt_mail_gesendet`;

            const response = await fetch(url, {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
            });

            if (!response.ok) {
              throw new Error("Supabase Fehler beim Lesen: " + await response.text());
            }

            const bestellungen = await response.json();
            console.log(`Nicht abgeholte Bestellungen für ${heuteDatum}:`, bestellungen.length);

            for (const bestellung of bestellungen) {
              if (!bestellung.email) continue;

              const mailResponse = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  service_id: EMAILJS_SERVICE_ID,
                  template_id: EMAILJS_TEMPLATE_ID,
                  user_id: EMAILJS_PUBLIC_KEY,
                  accessToken: EMAILJS_PRIVATE_KEY,
                  template_params: {
                    email: bestellung.email,
                    to_email: bestellung.email,
                    name: bestellung.email,
                    from_name: "MensaGo No-Reply",
                    reply_to: REPLY_TO,
                    betreff: "Ihre MensaGo-Bestellung wurde nicht abgeholt",
                    titel: "⚠️ Bestellung nicht abgeholt",
                    untertitel: "Ihre Vorbestellung wurde nicht rechtzeitig abgeholt",
                    nachricht: "Ihre MensaGo-Bestellung wurde heute leider nicht innerhalb der Abholzeit abgeholt.",
                    hinweis: "Der Status Ihrer Bestellung wurde auf „nicht abgeholt“ gesetzt.",
                    gericht: bestellung.gericht_name,
                    preis: bestellung.preis,
                    datum: bestellung.bestell_datum,
                    kategorie: bestellung.kategorie || "-"
                  },
                }),
              });

              if (!mailResponse.ok) {
                console.log("EmailJS Fehler:", await mailResponse.text());
                continue;
              }

              console.log("Nicht-abgeholt-Mail gesendet an:", bestellung.email);

              const updateUrl = `${SUPABASE_URL}/rest/v1/Bestellungen?id=eq.${bestellung.id}`;

              const updateResponse = await fetch(updateUrl, {
                method: "PATCH",
                headers: {
                  apikey: SUPABASE_ANON_KEY,
                  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                  "Content-Type": "application/json",
                  Prefer: "return=representation"
                },
                body: JSON.stringify({
                  nicht_abgeholt_mail_gesendet: true
                }),
              });

              if (!updateResponse.ok) {
                console.log("Fehler beim Aktualisieren:", await updateResponse.text());
              } else {
                console.log("Mail-Status gespeichert für Bestellung:", bestellung.id);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAILJS_GMAIL_SERVICE_ID: ${{ secrets.EMAILJS_GMAIL_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
